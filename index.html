<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clippa — Gestão de Professores</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #F97316;
      --orange-dark: #EA6A0A;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
      --gray-900: #111827;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .logo { height: 28px; margin-bottom: 40px; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    }
    h1 { font-size: 22px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: var(--gray-400); margin-bottom: 32px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .pin-wrap { position: relative; margin-bottom: 20px; }
    .pin-wrap input {
      width: 100%;
      padding: 14px 16px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 10px;
      border: 2px solid var(--gray-200);
      border-radius: 12px;
      outline: none;
      color: var(--gray-900);
      transition: border-color .15s;
      background: var(--gray-50);
    }
    .pin-wrap input:focus { border-color: var(--orange); background: white; }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:hover { background: var(--orange-dark); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; transform: none; }
    .error {
      background: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .footer { margin-top: 32px; font-size: 12px; color: var(--gray-400); }
  </style>
</head>
<body>
  <img src="logo_clippa_oficial.png" alt="Clippa" class="logo" onerror="this.style.display='none'">
  <div class="card">
    <h1>Olá! 👋</h1>
    <p class="subtitle">Digite seu PIN para acessar o sistema</p>
    <label for="usernameInput">Usuário</label>
    <div class="pin-wrap" style="margin-bottom:14px">
      <input type="text" id="usernameInput" placeholder="seu usuário" autocomplete="off" style="font-size:16px;letter-spacing:normal">
    </div>
    <label for="pinInput">PIN</label>
    <div class="pin-wrap">
      <input type="password" id="pinInput" maxlength="6" inputmode="numeric" placeholder="••••" autocomplete="off">
    </div>
    <div class="error" id="errorMsg">Usuário ou PIN incorreto. Tente novamente.</div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Entrar</button>
  </div>
  <p class="footer">Clippa — Sistema de Gestão de Professores</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://kcbxkbrxgalsceivquwu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C2UiZhnZN2unCt3MebBdlg_ccvMea--';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    sessionStorage.removeItem('clippa_auth');

    const pinInput = document.getElementById('pinInput');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('usernameInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('pinInput').focus(); });
    document.getElementById('usernameInput').focus();

    async function doLogin() {
      const pin = pinInput.value.trim();
      if (!pin) return;
      loginBtn.disabled = true;
      loginBtn.textContent = 'Verificando...';
      errorMsg.style.display = 'none';
      try {
        const username = document.getElementById('usernameInput').value.trim().toLowerCase();
        if (!username) { errorMsg.style.display = 'block'; return; }
        const { data, error } = await sb
          .from('app_users')
          .select('*')
          .eq('username', username)
          .eq('pin', pin)
          .eq('active', true)
          .limit(1)
          .single();
        if (error || !data) {
          errorMsg.style.display = 'block';
          pinInput.value = '';
          pinInput.focus();
          return;
        }
        sessionStorage.setItem('clippa_auth', JSON.stringify({
          userId: data.id,
          name: data.name,
          role: data.role,
          clubId: data.club_id,
          professorId: data.professor_id || null,
        }));
        if (data.role === 'gestor') window.location.href = 'dashboard.html';
        else if (data.role === 'professor') window.location.href = `professor.html?id=${data.professor_id}`;
        else window.location.href = 'registro.html';
      } catch (e) {
        errorMsg.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
