<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Aula</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #F97316; --orange-dark: #EA6A0A; --orange-light: #FFF7ED;
      --purple: #8B5CF6; --green: #10B981;
      --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
      --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563;
      --gray-700: #374151; --gray-800: #1F2937; --gray-900: #111827;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }

    /* HEADER */
    .top-bar { background: white; border-bottom: 1px solid var(--gray-200); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .top-bar img { height: 24px; }
    .club-name { font-size: 15px; font-weight: 700; color: var(--gray-800); }

    main { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }

    /* STEPS */
    .step { display: none; }
    .step.active { display: block; }
    .step-header { margin-bottom: 24px; }
    .step-header h1 { font-size: 22px; font-weight: 700; color: var(--gray-900); }
    .step-header p { font-size: 14px; color: var(--gray-400); margin-top: 4px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gray-400); cursor: pointer; margin-bottom: 20px; padding: 6px 0; border: none; background: none; transition: color .15s; }
    .back-link:hover { color: var(--gray-700); }

    /* PROFESSOR CARDS */
    .prof-grid { display: flex; flex-direction: column; gap: 12px; }
    .prof-card { background: white; border: 1.5px solid var(--gray-200); border-radius: 14px; padding: 18px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: .15s; }
    .prof-card:hover { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-light); }
    .prof-avatar { width: 48px; height: 48px; border-radius: 13px; background: var(--orange); color: white; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .prof-card-info h3 { font-size: 16px; font-weight: 700; color: var(--gray-800); }
    .prof-card-info p { font-size: 13px; color: var(--gray-400); margin-top: 2px; }
    .prof-card-arrow { margin-left: auto; color: var(--gray-300); font-size: 18px; }

    /* CALENDAR */
    .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .calendar-nav h2 { font-size: 16px; font-weight: 700; text-transform: capitalize; }
    .cal-btn { background: none; border: 1px solid var(--gray-200); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--gray-500); transition: .15s; }
    .cal-btn:hover { border-color: var(--orange); color: var(--orange); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
    .cal-day-header { text-align: center; font-size: 11px; font-weight: 600; color: var(--gray-400); padding: 6px 0; text-transform: uppercase; }
    .cal-day { text-align: center; padding: 10px 4px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: .15s; border: none; background: none; color: var(--gray-700); }
    .cal-day:hover:not(:disabled) { background: var(--orange-light); color: var(--orange); }
    .cal-day.has-slots { font-weight: 700; color: var(--gray-900); }
    .cal-day.has-slots::after { content: ''; display: block; width: 4px; height: 4px; background: var(--orange); border-radius: 50%; margin: 2px auto 0; }
    .cal-day.selected { background: var(--orange); color: white; font-weight: 700; }
    .cal-day.selected::after { background: white; }
    .cal-day:disabled { color: var(--gray-300); cursor: not-allowed; }
    .cal-day.other-month { color: var(--gray-300); }

    /* TIME SLOTS */
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .slot-btn { padding: 12px; border: 1.5px solid var(--gray-200); border-radius: 10px; background: white; font-size: 14px; font-weight: 600; color: var(--gray-700); cursor: pointer; transition: .15s; text-align: center; }
    .slot-btn:hover { border-color: var(--orange); color: var(--orange); }
    .slot-btn.selected { background: var(--orange); border-color: var(--orange); color: white; }
    .slot-btn.occupied { background: var(--gray-100); color: var(--gray-300); cursor: not-allowed; border-color: var(--gray-200); text-decoration: line-through; }

    /* FORM */
    .card { background: white; border-radius: 16px; border: 1px solid var(--gray-200); padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 7px; }
    .form-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: 14px; color: var(--gray-900); outline: none; transition: border-color .15s; background: var(--gray-50); font-family: inherit; }
    .form-input:focus { border-color: var(--orange); background: white; }
    select.form-input { cursor: pointer; }
    .resumo-box { background: var(--orange-light); border: 1px solid #FED7AA; border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
    .resumo-box h3 { font-size: 14px; font-weight: 700; color: var(--orange-dark); margin-bottom: 8px; }
    .resumo-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray-700); margin-bottom: 4px; }
    .resumo-row span:last-child { font-weight: 600; }
    .btn-agendar { width: 100%; padding: 14px; background: var(--orange); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .15s; }
    .btn-agendar:hover { background: var(--orange-dark); }
    .btn-agendar:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }

    /* SUCCESS */
    .success-box { text-align: center; padding: 40px 20px; background: white; border-radius: 20px; border: 1px solid var(--gray-200); }
    .success-icon { font-size: 64px; margin-bottom: 16px; }
    .success-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .success-sub { font-size: 14px; color: var(--gray-400); margin-bottom: 28px; line-height: 1.6; }
    .btn-wpp { display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: white; border: none; border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 12px; width: 100%; justify-content: center; }
    .btn-novo { display: inline-flex; justify-content: center; width: 100%; padding: 12px; background: var(--gray-100); color: var(--gray-600); border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }

    .loading { padding: 40px; text-align: center; color: var(--gray-400); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--gray-200); border-top-color: var(--orange); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { padding: 32px; text-align: center; color: var(--gray-400); font-size: 14px; }
  </style>
</head>
<body>

<div class="top-bar">
  <img src="logo_clippa_oficial.png" alt="Clippa" onerror="this.style.display='none'">
  <span class="club-name" id="clubNameTop">—</span>
</div>

<main>

  <!-- STEP 1: Escolher professor -->
  <div class="step active" id="step1">
    <div class="step-header">
      <h1 id="step1Title">Agendar Aula</h1>
      <p>Escolha o professor para continuar</p>
    </div>
    <div class="prof-grid" id="profGrid">
      <div class="loading"><span class="spinner"></span>Carregando...</div>
    </div>
  </div>

  <!-- STEP 2: Escolher data e horário -->
  <div class="step" id="step2">
    <button class="back-link" onclick="goStep(1)">← Voltar</button>
    <div class="step-header">
      <h1 id="step2ProfName">—</h1>
      <p>Escolha a data e horário</p>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="calendar-nav">
        <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
        <h2 id="calMonthLabel">—</h2>
        <button class="cal-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-day-header">Dom</div>
        <div class="cal-day-header">Seg</div>
        <div class="cal-day-header">Ter</div>
        <div class="cal-day-header">Qua</div>
        <div class="cal-day-header">Qui</div>
        <div class="cal-day-header">Sex</div>
        <div class="cal-day-header">Sáb</div>
      </div>
      <div class="cal-grid" id="calDays"></div>
    </div>

    <div id="slotsSection" style="display:none">
      <h3 style="font-size:14px;font-weight:600;color:var(--gray-700);margin-bottom:12px" id="slotsDateLabel">—</h3>
      <div class="slots-grid" id="slotsGrid"></div>
    </div>
  </div>

  <!-- STEP 3: Dados do aluno -->
  <div class="step" id="step3">
    <button class="back-link" onclick="goStep(2)">← Voltar</button>
    <div class="step-header">
      <h1>Seus dados</h1>
      <p>Preencha para confirmar a reserva</p>
    </div>
    <div class="resumo-box" id="step3Resumo"></div>
    <div class="card">
      <div class="form-group">
        <label class="form-label">Seu nome</label>
        <input type="text" class="form-input" id="studentName" placeholder="Nome completo">
      </div>
      <div class="form-group">
        <label class="form-label">WhatsApp</label>
        <input type="tel" class="form-input" id="studentPhone" placeholder="(48) 99999-9999">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo de Aula</label>
        <select class="form-input" id="lessonTypeSelect">
          <option value="">Selecionar...</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Observações</label>
        <input type="text" class="form-input" id="studentNotes" placeholder="Opcional">
      </div>
      <button class="btn-agendar" id="btnAgendar" onclick="submitReserva()">Confirmar Reserva</button>
    </div>
  </div>

  <!-- STEP 4: Sucesso -->
  <div class="step" id="step4">
    <div class="success-box">
      <div class="success-icon">🎾</div>
      <div class="success-title">Reserva enviada!</div>
      <div class="success-sub" id="successMsg">—</div>
      <button class="btn-wpp" id="btnWpp" onclick="abrirWpp()">Abrir WhatsApp do professor</button>
      <button class="btn-novo" onclick="goStep(1)">Fazer outra reserva</button>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://kcbxkbrxgalsceivquwu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_C2UiZhnZN2unCt3MebBdlg_ccvMea--';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Pega clube pelo slug na URL: ?slug=riomafra ou ?club=uuid
  const params = new URLSearchParams(location.search);
  const clubSlug = params.get('slug');
  const clubIdParam = params.get('club');

  let club = null, professors = [], lessonTypes = [];
  let selectedProf = null, selectedDate = null, selectedTime = null;
  let calYear, calMonth;
  let agendaPadrao = [], agendaPontual = [], reservasExistentes = [];

  const DAYS_FULL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

  function fmt(n) { return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2 }); }

  async function init() {
    // Load club
    let q = sb.from('clubs').select('*');
    if (clubSlug) q = q.eq('slug', clubSlug);
    else if (clubIdParam) q = q.eq('id', clubIdParam);
    else { document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#9CA3AF">Link inválido. Acesse pelo link fornecido pelo clube.</div>'; return; }
    const { data: clubs } = await q.single();
    if (!clubs) { document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#9CA3AF">Clube não encontrado.</div>'; return; }
    club = clubs;
    document.getElementById('clubNameTop').textContent = club.name;
    document.getElementById('step1Title').textContent = club.name;
    document.title = `Agendar Aula — ${club.name}`;

    // Load professors
    const { data: profs } = await sb.from('professors').select('*').eq('club_id', club.id).eq('active', true).order('name');
    professors = profs || [];

    // Load lesson types
    const { data: types } = await sb.from('lesson_types').select('*').eq('club_id', club.id).eq('active', true).order('sort_order');
    lessonTypes = types || [];

    // Populate lesson type select
    document.getElementById('lessonTypeSelect').innerHTML = '<option value="">Selecionar...</option>' +
      lessonTypes.map(t => `<option value="${t.id}">${t.name} — ${fmt(t.total_price)}</option>`).join('');

    renderProfGrid();
  }

  function renderProfGrid() {
    const COLORS = ['#F97316','#8B5CF6','#10B981','#3B82F6','#EC4899','#F59E0B'];
    if (!professors.length) {
      document.getElementById('profGrid').innerHTML = '<div class="empty">Nenhum professor disponível no momento.</div>';
      return;
    }
    document.getElementById('profGrid').innerHTML = professors.map((p, i) => `
      <div class="prof-card" onclick="selectProf('${p.id}')">
        <div class="prof-avatar" style="background:${COLORS[i % COLORS.length]}">${p.name[0]}</div>
        <div class="prof-card-info">
          <h3>${p.name}</h3>
          <p>Clique para ver horários disponíveis</p>
        </div>
        <span class="prof-card-arrow">→</span>
      </div>`).join('');
  }

  async function selectProf(id) {
    selectedProf = professors.find(p => p.id === id);
    document.getElementById('step2ProfName').textContent = selectedProf.name;

    // Load professor's agenda
    const [{ data: pad }, { data: pont }, { data: res }] = await Promise.all([
      sb.from('agenda_padrao').select('*').eq('professor_id', id).eq('active', true),
      sb.from('agenda_pontual').select('*').eq('professor_id', id),
      sb.from('reservas').select('date,time').eq('professor_id', id).in('status', ['pendente','confirmada']),
    ]);
    agendaPadrao = pad || [];
    agendaPontual = pont || [];
    reservasExistentes = res || [];

    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    renderCalendar();
    goStep(2);
  }

  function goStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(`step${n}`).classList.add('active');
    window.scrollTo(0, 0);
  }

  function changeMonth(delta) {
    calMonth += delta;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
    document.getElementById('slotsSection').style.display = 'none';
    selectedDate = null; selectedTime = null;
  }

  function getAvailableSlots(date) {
    const dow = date.getDay();
    const dateStr = date.toISOString().split('T')[0];

    // Check if blocked
    const bloqueios = agendaPontual.filter(p => p.date === dateStr && p.type === 'bloqueado');
    if (bloqueios.some(b => !b.start_time)) return []; // Dia inteiro bloqueado

    // Get base slots from agenda padrão
    const padroes = agendaPadrao.filter(a => a.day_of_week === dow);

    // Check extra disponível
    const extras = agendaPontual.filter(p => p.date === dateStr && p.type === 'disponivel');

    let allSlots = [];

    // From padrão
    padroes.forEach(a => {
      const slots = generateSlots(a.start_time, a.end_time, a.slot_minutes);
      allSlots = [...allSlots, ...slots];
    });

    // From extras
    extras.forEach(a => {
      if (a.start_time && a.end_time) {
        // Need to know slot_minutes — default to 60
        const slots = generateSlots(a.start_time, a.end_time, 60);
        allSlots = [...allSlots, ...slots];
      }
    });

    // Remove slots blocked by pontual
    bloqueios.forEach(b => {
      if (b.start_time) {
        allSlots = allSlots.filter(s => s < b.start_time || s >= b.end_time);
      }
    });

    // Remove duplicates and sort
    allSlots = [...new Set(allSlots)].sort();

    // Mark occupied
    const occupied = reservasExistentes.filter(r => r.date === dateStr).map(r => r.time?.slice(0,5));

    return allSlots.map(s => ({ time: s, occupied: occupied.includes(s) }));
  }

  function generateSlots(start, end, minutes) {
    const slots = [];
    let [h, m] = start.slice(0,5).split(':').map(Number);
    const [eh, em] = end.slice(0,5).split(':').map(Number);
    const endMins = eh * 60 + em;
    while (h * 60 + m < endMins) {
      slots.push(`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`);
      m += minutes;
      if (m >= 60) { h++; m -= 60; }
    }
    return slots;
  }

  function renderCalendar() {
    const label = new Date(calYear, calMonth, 1).toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
    document.getElementById('calMonthLabel').textContent = label;

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const today = new Date(); today.setHours(0,0,0,0);

    let html = '';
    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) html += '<button class="cal-day other-month" disabled></button>';

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(calYear, calMonth, d);
      const isPast = date < today;
      const dateStr = date.toISOString().split('T')[0];
      const slots = isPast ? [] : getAvailableSlots(date);
      const hasSlots = slots.some(s => !s.occupied);
      const isSelected = selectedDate === dateStr;
      let cls = 'cal-day';
      if (hasSlots) cls += ' has-slots';
      if (isSelected) cls += ' selected';
      html += `<button class="${cls}" ${isPast || !hasSlots ? 'disabled' : `onclick="selectDate('${dateStr}', ${d})"`}>${d}</button>`;
    }
    document.getElementById('calDays').innerHTML = html;
  }

  function selectDate(dateStr, day) {
    selectedDate = dateStr;
    selectedTime = null;
    renderCalendar();

    const date = new Date(dateStr + 'T12:00:00');
    const label = date.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
    document.getElementById('slotsDateLabel').textContent = label.charAt(0).toUpperCase() + label.slice(1);

    const slots = getAvailableSlots(new Date(dateStr + 'T12:00:00'));
    document.getElementById('slotsGrid').innerHTML = slots.map(s => `
      <button class="slot-btn${s.occupied ? ' occupied' : ''}" ${s.occupied ? 'disabled' : `onclick="selectTime('${s.time}', this)"`}>
        ${s.time}
      </button>`).join('');
    document.getElementById('slotsSection').style.display = 'block';
  }

  function selectTime(time, btn) {
    selectedTime = time;
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    // Auto advance to step 3 after short delay
    setTimeout(() => {
      const date = new Date(selectedDate + 'T12:00:00');
      const dateLabel = date.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
      document.getElementById('step3Resumo').innerHTML = `
        <h3>Resumo da reserva</h3>
        <div class="resumo-row"><span>Professor</span><span>${selectedProf.name}</span></div>
        <div class="resumo-row"><span>Data</span><span>${dateLabel}</span></div>
        <div class="resumo-row"><span>Horário</span><span>${time}</span></div>`;
      goStep(3);
    }, 300);
  }

  async function submitReserva() {
    const name = document.getElementById('studentName').value.trim();
    const phone = document.getElementById('studentPhone').value.trim().replace(/\D/g,'');
    const typeId = document.getElementById('lessonTypeSelect').value;
    const notes = document.getElementById('studentNotes').value.trim();

    if (!name) { alert('Digite seu nome.'); return; }
    if (!phone || phone.length < 10) { alert('Digite um WhatsApp válido.'); return; }
    if (!typeId) { alert('Selecione o tipo de aula.'); return; }

    const btn = document.getElementById('btnAgendar');
    btn.disabled = true; btn.textContent = 'Enviando...';

    const { error } = await sb.from('reservas').insert({
      professor_id: selectedProf.id,
      club_id: club.id,
      lesson_type_id: typeId,
      date: selectedDate,
      time: selectedTime + ':00',
      student_name: name,
      student_phone: phone,
      status: 'pendente',
      notes: notes || null,
    });

    btn.disabled = false; btn.textContent = 'Confirmar Reserva';
    if (error) { alert('Erro ao enviar: ' + error.message); return; }

    const date = new Date(selectedDate + 'T12:00:00');
    const dateLabel = date.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
    const typeName = lessonTypes.find(t => t.id === typeId)?.name || '';
    document.getElementById('successMsg').innerHTML = `Sua reserva de <strong>${typeName}</strong> com <strong>${selectedProf.name}</strong><br>${dateLabel} às ${selectedTime} foi enviada!<br><br>Aguarde a confirmação do professor.`;

    // Store for WhatsApp
    window._wppData = { phone: selectedProf.whatsapp, studentName: name, studentPhone: phone, dateLabel, time: selectedTime, typeName };
    goStep(4);
  }

  function abrirWpp() {
    const d = window._wppData;
    if (!d?.phone) { alert('Número do professor não cadastrado. Entre em contato com o clube.'); return; }
    const msg = encodeURIComponent(`Olá ${selectedProf.name}! Me chamo ${d.studentName} e acabei de fazer uma reserva pelo sistema:\n\n📅 ${d.dateLabel}\n⏰ ${d.time}\n🎾 ${d.typeName}\n📱 Meu WhatsApp: ${d.studentPhone}\n\nAguardo sua confirmação!`);
    window.open(`https://wa.me/${d.phone}?text=${msg}`, '_blank');
  }

  init();
</script>
</body>
</html>
