<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clippa — Registrar Aula</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #F97316; --orange-dark: #EA6A0A; --orange-light: #FFF7ED;
      --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
      --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563;
      --gray-700: #374151; --gray-800: #1F2937; --gray-900: #111827;
      --green: #10B981;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }

    nav { background: white; border-bottom: 1px solid var(--gray-200); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-logo { height: 24px; }
    .nav-title { font-size: 15px; font-weight: 600; color: var(--gray-800); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .user-chip { font-size: 13px; font-weight: 600; color: var(--gray-700); background: var(--gray-100); padding: 6px 12px; border-radius: 8px; }
    .btn-logout { font-size: 13px; color: var(--gray-500); background: none; border: 1px solid var(--gray-200); padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: .15s; }
    .btn-logout:hover { background: var(--gray-100); }

    main { max-width: 560px; margin: 0 auto; padding: 40px 24px 64px; }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 22px; font-weight: 700; }
    .page-header p { font-size: 14px; color: var(--gray-400); margin-top: 4px; }

    .card { background: white; border-radius: 16px; border: 1px solid var(--gray-100); padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: 14px; color: var(--gray-900); outline: none; transition: border-color .15s; background: var(--gray-50); }
    .form-input:focus { border-color: var(--orange); background: white; }
    select.form-input { cursor: pointer; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Calc preview */
    .calc-preview { background: var(--orange-light); border: 1px solid #FED7AA; border-radius: 10px; padding: 14px 16px; margin-top: -10px; margin-bottom: 18px; display: none; }
    .calc-preview-row { display: flex; justify-content: space-between; font-size: 13px; }
    .calc-preview-row + .calc-preview-row { margin-top: 6px; }
    .calc-label { color: var(--gray-500); }
    .calc-val { font-weight: 700; color: var(--gray-900); }
    .calc-val.orange { color: var(--orange); }

    /* Student inputs */
    .student-inputs { display: flex; flex-direction: column; gap: 8px; }
    .student-inputs input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 14px; outline: none; transition: border-color .15s; background: var(--gray-50); }
    .student-inputs input:focus { border-color: var(--orange); background: white; }
    .btn-add-student { background: none; border: 1.5px dashed var(--gray-300); color: var(--gray-500); border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 500; cursor: pointer; width: 100%; transition: .15s; margin-top: 8px; }
    .btn-add-student:hover { border-color: var(--orange); color: var(--orange); }

    .btn-submit { width: 100%; padding: 14px; background: var(--orange); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .15s; margin-top: 8px; }
    .btn-submit:hover { background: var(--orange-dark); }
    .btn-submit:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }

    /* Success state */
    .success-state { display: none; text-align: center; padding: 40px 20px; }
    .success-icon { font-size: 56px; margin-bottom: 16px; }
    .success-title { font-size: 20px; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .success-sub { font-size: 14px; color: var(--gray-400); margin-bottom: 28px; }
    .btn-new { padding: 12px 28px; background: var(--orange); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-new:hover { background: var(--orange-dark); }

    .loading { padding: 20px; text-align: center; color: var(--gray-400); font-size: 14px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--gray-200); border-top-color: var(--orange); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <img src="logo_clippa_oficial.png" alt="Clippa" class="nav-logo" onerror="this.style.display='none'">
      <span class="nav-title">Registrar Aula</span>
    </div>
    <div class="nav-right">
      <span class="user-chip" id="userChip">—</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Nova Aula</h1>
      <p>Preencha os dados para registrar a aula</p>
    </div>

    <div class="card">
      <!-- FORM -->
      <div id="formState">
        <div class="loading"><span class="spinner"></span>Carregando...</div>
      </div>

      <!-- SUCCESS -->
      <div class="success-state" id="successState">
        <div class="success-icon">✅</div>
        <div class="success-title">Aula registrada!</div>
        <div class="success-sub" id="successDesc">—</div>
        <button class="btn-new" onclick="resetForm()">Registrar outra aula</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://kcbxkbrxgalsceivquwu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C2UiZhnZN2unCt3MebBdlg_ccvMea--';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const auth = JSON.parse(sessionStorage.getItem('clippa_auth') || 'null');
    if (!auth) { window.location.href = 'index.html'; }
    document.getElementById('userChip').textContent = auth.name;

    function logout() { sessionStorage.removeItem('clippa_auth'); window.location.href = 'index.html'; }
    function fmt(n) { return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2 }); }

    let professors = [], lessonTypes = [];

    async function loadData() {
      const [{ data: profs }, { data: types }] = await Promise.all([
        sb.from('professors').select('*').eq('club_id', auth.clubId).eq('active', true).order('name'),
        sb.from('lesson_types').select('*').eq('club_id', auth.clubId).eq('active', true).order('sort_order'),
      ]);
      professors = profs || [];
      lessonTypes = types || [];
      renderForm();
    }

    function renderForm() {
      document.getElementById('formState').innerHTML = `
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Professor</label>
            <select class="form-input" id="fProf">
              <option value="">Selecionar...</option>
              ${professors.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Data</label>
            <input type="date" class="form-input" id="fDate" value="${new Date().toISOString().split('T')[0]}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Aula</label>
          <select class="form-input" id="fType" onchange="onTypeChange()">
            <option value="">Selecionar...</option>
            ${lessonTypes.map(t => `<option value="${t.id}" data-price="${t.total_price}" data-prof="${t.prof_pct}" data-clube="${t.club_pct}" data-students="${t.num_students}">${t.name} — ${fmt(t.total_price)}</option>`).join('')}
          </select>
        </div>

        <div class="form-group" id="priceGroup" style="display:none">
          <label class="form-label">Valor da Aula (R$)</label>
          <input type="number" class="form-input" id="fPrice" placeholder="0,00" min="0" step="0.01" oninput="recalcPreview()">
        </div>

        <div class="calc-preview" id="calcPreview">
          <div class="calc-preview-row"><span class="calc-label">Valor total da aula</span><span class="calc-val" id="pTotal">—</span></div>
          <div class="calc-preview-row"><span class="calc-label">Para o professor</span><span class="calc-val orange" id="pProf">—</span></div>
          <div class="calc-preview-row"><span class="calc-label">Para o clube</span><span class="calc-val" id="pClube">—</span></div>
        </div>

        <div class="form-group">
          <label class="form-label">Alunos</label>
          <div class="student-inputs" id="studentInputs"></div>
          <button class="btn-add-student" id="addStudentBtn" onclick="addStudentInput()" style="display:none">+ Adicionar aluno</button>
        </div>

        <div class="form-group">
          <label class="form-label">Observações</label>
          <input type="text" class="form-input" id="fNotes" placeholder="Opcional">
        </div>

        <button class="btn-submit" id="submitBtn" onclick="submitForm()">Registrar Aula</button>
      `;
    }

    function recalcPreview() {
      const sel = document.getElementById('fType');
      const opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.value) return;
      const price = parseFloat(document.getElementById('fPrice').value) || 0;
      const profPct = parseFloat(opt.dataset.prof);
      const clubePct = parseFloat(opt.dataset.clube);
      document.getElementById('pTotal').textContent = fmt(price);
      document.getElementById('pProf').textContent = `${fmt(price * profPct / 100)} (${profPct}%)`;
      document.getElementById('pClube').textContent = `${fmt(price * clubePct / 100)} (${clubePct}%)`;
      document.getElementById('calcPreview').style.display = 'block';
    }

    function onTypeChange() {
      const sel = document.getElementById('fType');
      const opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.value) {
        document.getElementById('calcPreview').style.display = 'none';
        document.getElementById('priceGroup').style.display = 'none';
        document.getElementById('studentInputs').innerHTML = '';
        document.getElementById('addStudentBtn').style.display = 'none';
        return;
      }
      const price = parseFloat(opt.dataset.price);
      const numStudents = parseInt(opt.dataset.students) || 0;

      document.getElementById('fPrice').value = price;
      document.getElementById('priceGroup').style.display = 'block';
      recalcPreview();

      const inputs = document.getElementById('studentInputs');
      inputs.innerHTML = '';
      const count = numStudents > 0 ? numStudents : 1;
      for (let i = 0; i < count; i++) addStudentInput();
      document.getElementById('addStudentBtn').style.display = numStudents === 0 ? 'block' : 'none';
    }

    function addStudentInput(val = '') {
      const wrap = document.getElementById('studentInputs');
      const inp = document.createElement('input');
      inp.placeholder = `Nome do aluno ${wrap.children.length + 1}`;
      inp.value = val;
      wrap.appendChild(inp);
    }

    async function submitForm() {
      const profId = document.getElementById('fProf').value;
      const date = document.getElementById('fDate').value;
      const typeId = document.getElementById('fType').value;
      const notes = document.getElementById('fNotes').value.trim();
      const students = Array.from(document.getElementById('studentInputs').querySelectorAll('input'))
        .map(i => i.value.trim()).filter(Boolean);

      if (!profId) { alert('Selecione o professor.'); return; }
      if (!date) { alert('Selecione a data.'); return; }
      if (!typeId) { alert('Selecione o tipo de aula.'); return; }

      const opt = document.querySelector(`#fType option[value="${typeId}"]`);
      const price = parseFloat(document.getElementById('fPrice').value) || parseFloat(opt.dataset.price);
      const profPct = parseFloat(opt.dataset.prof);
      const profVal = price * profPct / 100;
      const clubeVal = price - profVal;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Salvando...';

      const { error } = await sb.from('lessons').insert({
        professor_id: profId,
        lesson_type_id: typeId,
        date,
        students,
        total_value: price,
        prof_value: profVal,
        club_value: clubeVal,
        notes: notes || null,
      });

      if (error) { alert('Erro ao salvar: ' + error.message); btn.disabled = false; btn.textContent = 'Registrar Aula'; return; }

      const profName = professors.find(p => p.id === profId)?.name || '';
      const typeName = opt.text.split(' —')[0];
      const dateStr = new Date(date + 'T12:00:00').toLocaleDateString('pt-BR');
      document.getElementById('successDesc').textContent = `${typeName} com ${profName} em ${dateStr}${students.length ? ' — ' + students.join(', ') : ''}`;
      document.getElementById('formState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    }

    function resetForm() {
      document.getElementById('successState').style.display = 'none';
      document.getElementById('formState').style.display = 'block';
      renderForm();
    }

    loadData();
  </script>
</body>
</html>
